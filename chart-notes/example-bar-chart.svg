<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="'Instrument Sans', ui-sans-serif, system-ui, sans-serif">
  <!--
    Starting template - categorical comparison, one accented bar.
    Swap the category labels, values, and bar heights for real data;
    keep everything else (stroke widths, radii, the 4px-grid spacing,
    the single accent) as-is. See style-guide.md for the full rules.

    Colors are CSS custom properties (with light-mode fallbacks) so
    this tracks the site's real light/dark theme automatically once
    embedded in a page that defines --text/--label/--border/etc. on
    an ancestor - see preview.html for both themes side by side.
  -->

  <!-- baseline -->
  <line x1="60" y1="280" x2="452" y2="280" style="stroke:var(--border,#e0ded7)" stroke-width="1" />

  <!-- rotated axis label -->
  <text x="24" y="164" style="fill:var(--label,#7a7a7a)" font-size="10" letter-spacing="1"
        transform="rotate(-90 24 164)" text-anchor="middle">VALUE</text>

  <!-- bar 1 -->
  <rect x="72" y="160" width="48" height="120" style="fill:var(--hover-bg,#e8e7e2);stroke:var(--border,#e0ded7)" stroke-width="1" />
  <text x="96" y="152" style="fill:var(--label,#7a7a7a)" font-size="12" text-anchor="middle">120</text>
  <text x="96" y="300" style="fill:var(--label,#7a7a7a)" font-size="11" text-anchor="middle">A</text>

  <!-- bar 2 -->
  <rect x="144" y="130" width="48" height="150" style="fill:var(--hover-bg,#e8e7e2);stroke:var(--border,#e0ded7)" stroke-width="1" />
  <text x="168" y="122" style="fill:var(--label,#7a7a7a)" font-size="12" text-anchor="middle">150</text>
  <text x="168" y="300" style="fill:var(--label,#7a7a7a)" font-size="11" text-anchor="middle">B</text>

  <!-- bar 3 -->
  <rect x="216" y="115" width="48" height="165" style="fill:var(--hover-bg,#e8e7e2);stroke:var(--border,#e0ded7)" stroke-width="1" />
  <text x="240" y="107" style="fill:var(--label,#7a7a7a)" font-size="12" text-anchor="middle">165</text>
  <text x="240" y="300" style="fill:var(--label,#7a7a7a)" font-size="11" text-anchor="middle">C</text>

  <!-- bar 4 - accented, the one thing to notice -->
  <rect x="288" y="70" width="48" height="210" style="fill:var(--selection-bg,#1f3d2e);stroke:var(--selection-bg,#1f3d2e)" stroke-width="1" />
  <text x="312" y="62" style="fill:var(--title,#262626)" font-size="12" font-weight="500" text-anchor="middle">210</text>
  <text x="312" y="300" style="fill:var(--title,#262626)" font-size="11" font-weight="500" text-anchor="middle">D</text>

  <!-- bar 5 -->
  <rect x="360" y="140" width="48" height="140" style="fill:var(--hover-bg,#e8e7e2);stroke:var(--border,#e0ded7)" stroke-width="1" />
  <text x="384" y="132" style="fill:var(--label,#7a7a7a)" font-size="12" text-anchor="middle">140</text>
  <text x="384" y="300" style="fill:var(--label,#7a7a7a)" font-size="11" text-anchor="middle">E</text>
</svg>
