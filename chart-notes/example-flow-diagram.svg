<svg viewBox="0 0 320 400" xmlns="http://www.w3.org/2000/svg" font-family="'Instrument Sans', ui-sans-serif, system-ui, sans-serif">
  <!--
    Starting template - a simple 4-step process with one accented
    outcome node. Swap the labels; keep the pill/rectangle/pill shape
    grammar (pill = start/end, rectangle = a step, sharp corners) and
    the single accent on whichever outcome matters. See
    style-guide.md for the full rules.

    Light-mode hex only - see style-guide.md's token table for the
    dark-mode equivalents if this needs to ship theme-aware.
  -->

  <!-- arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a" />
    </marker>
  </defs>

  <!-- start (pill) -->
  <rect x="88" y="16" width="144" height="40" rx="20" fill="#e8e7e2" stroke="#e0ded7" stroke-width="1" />
  <text x="160" y="41" fill="#262626" font-size="13" font-weight="500" text-anchor="middle">New request</text>

  <line x1="160" y1="56" x2="160" y2="88" stroke="#7a7a7a" stroke-width="1" marker-end="url(#arrow)" />

  <!-- step 1 (rectangle) -->
  <rect x="72" y="92" width="176" height="44" fill="#ffffff" stroke="#262626" stroke-width="1" />
  <text x="160" y="119" fill="#262626" font-size="13" text-anchor="middle">Check existing cache</text>

  <line x1="160" y1="136" x2="160" y2="168" stroke="#7a7a7a" stroke-width="1" marker-end="url(#arrow)" />

  <!-- decision (diamond) -->
  <path d="M160,172 L232,208 L160,244 L88,208 Z" fill="#ffffff" stroke="#262626" stroke-width="1" />
  <text x="160" y="204" fill="#262626" font-size="12" text-anchor="middle">Cache hit?</text>
  <text x="160" y="219" fill="#7a7a7a" font-size="11" text-anchor="middle">&gt;80% fresh</text>

  <!-- "no" branch to a second step -->
  <line x1="232" y1="208" x2="272" y2="208" stroke="#7a7a7a" stroke-width="1" />
  <text x="252" y="200" fill="#7a7a7a" font-size="10" text-anchor="middle">NO</text>
  <line x1="272" y1="208" x2="272" y2="244" stroke="#7a7a7a" stroke-width="1" marker-end="url(#arrow)" />
  <rect x="196" y="248" width="152" height="40" fill="#ffffff" stroke="#262626" stroke-width="1" />
  <text x="272" y="273" fill="#262626" font-size="12" text-anchor="middle">Rebuild from source</text>

  <!-- "yes" branch straight down to the accented outcome -->
  <text x="176" y="240" fill="#7a7a7a" font-size="10">YES</text>
  <line x1="160" y1="244" x2="160" y2="288" stroke="#7a7a7a" stroke-width="1" marker-end="url(#arrow)" />

  <!-- outcome (accented pill) - the one thing to notice -->
  <rect x="88" y="292" width="144" height="44" rx="22" fill="#1f3d2e" stroke="#1f3d2e" stroke-width="1" />
  <text x="160" y="313" fill="#f8f8f6" font-size="13" font-weight="500" text-anchor="middle">Served in &lt;50ms</text>
  <text x="160" y="328" fill="#f8f8f6" font-size="10" text-anchor="middle" opacity="0.8">no origin hit</text>
</svg>
