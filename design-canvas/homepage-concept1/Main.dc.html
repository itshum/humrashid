<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.7; }
  </style>
</helmet>

<div style="width: 1440px; min-height: 1500px; background: oklch(0.99 0.003 80); position: relative; color: oklch(0.18 0.01 80);">

  <!-- grid guides: real site spec, 12 cols / 24px gutter / 64px margin -->
  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; padding: 0 64px; pointer-events: none; z-index: 0;">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="12">
      <div style="border-left: 1px dashed oklch(0.18 0.01 80 / 0.06); border-right: 1px dashed oklch(0.18 0.01 80 / 0.06); height: 100%;"></div>
    </sc-for>
  </div>

  <!-- simple top nav -->
  <div style="position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 28px 64px; border-bottom: 1px solid oklch(0.18 0.01 80 / 0.08); background: oklch(0.99 0.003 80 / 0.85); backdrop-filter: blur(12px);">
    <div style="font-weight: 700; font-size: 17px; letter-spacing: -0.01em;">Hum Rashid</div>
    <div style="display: flex; gap: 32px; font-size: 15px; font-weight: 500;">
      <a href="#" style="color: {{accent}};">Work</a>
      <a href="#" style="color: oklch(0.18 0.01 80 / 0.55);">About</a>
    </div>
  </div>

  <!-- hero -->
  <div style="position: relative; z-index: 1; padding: 140px 64px 100px; max-width: 920px;">
    <div style="font-size: 44px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; max-width: 14ch;">
      Positioning statement placeholder — locked during content phase.
    </div>
  </div>

  <!-- case study grid: 4 cards, 6 cols each (half width), 2x2 -->
  <div style="position: relative; z-index: 1; display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; padding: 0 64px 120px;">
    <sc-for list="{{cases}}" as="cs" hint-placeholder-count="4">
      <div style="grid-column: span 6; background: oklch(1 0 0); border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px oklch(0.18 0.01 80 / 0.04), 0 12px 32px oklch(0.18 0.01 80 / 0.06);">
        <div style="height: 280px; border-radius: 16px; background: oklch(0.95 0.006 80); margin-bottom: 20px;"></div>
        <div style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">{{cs.title}}</div>
        <div style="font-size: 15px; color: oklch(0.18 0.01 80 / 0.6); line-height: 1.5; margin-bottom: 16px; max-width: 42ch;">{{cs.summary}}</div>
        <a href="#" style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: {{accent}};">
          Read Case Study
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#b3552c","options":["#b3552c","#8a6d3b","#5c6b73","#7a5c8c"]}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#b3552c',
      cols: Array.from({length: 12}),
      cases: [
        { title: 'Pack Digital', summary: 'Product strategy and UI design for headless infrastructure startup.' },
        { title: 'Inveterate', summary: 'Product strategy and UI design for membership & loyalty startup.' },
        { title: 'PPVP', summary: 'Product strategy and mobile app design for SaaS investment fund.' },
        { title: 'Sublime Security', summary: 'Quarantine digests and dynamic phishing simulation campaigns for security teams.' },
      ],
    };
  }
}
</script>
</body>
</html>
