<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }
  </style>
</helmet>

<div style="width: 1320px; height: 640px; background: oklch(0.965 0.006 75); padding: 48px; position: relative;">

  <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: oklch(0.18 0.01 80 / 0.45); margin-bottom: 16px;">01 — Floating pill</div>
  <div style="display: flex; justify-content: center; margin-bottom: 56px;">
    <div style="display: flex; align-items: center; gap: 24px; padding: 12px 22px; border-radius: 999px; background: oklch(1 0 0 / 0.75); backdrop-filter: blur(18px) saturate(160%); border: 1px solid oklch(1 0 0 / 0.6); box-shadow: 0 1px 1px oklch(0.18 0.01 80 / 0.04), 0 16px 32px oklch(0.18 0.01 80 / 0.1);">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: {{accent}};"></div>
      <div style="font-weight: 700; font-size: 14px;">Hum Rashid</div>
      <div style="width: 1px; height: 14px; background: oklch(0.18 0.01 80 / 0.12);"></div>
      <a href="#" style="font-size: 13px; font-weight: 600; color: {{accent}};">Work</a>
      <a href="#" style="font-size: 13px; font-weight: 500; color: oklch(0.18 0.01 80 / 0.5);">About</a>
    </div>
  </div>

  <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: oklch(0.18 0.01 80 / 0.45); margin-bottom: 16px;">02 — Full-width glass bar</div>
  <div style="margin-bottom: 56px; padding: 18px 32px; border-radius: 20px; background: oklch(0.16 0.006 80 / 0.9); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 20px 40px oklch(0.18 0.01 80 / 0.14);">
    <div style="font-weight: 700; font-size: 15px; color: oklch(0.97 0.003 80);">Hum Rashid</div>
    <div style="display: flex; gap: 36px;">
      <a href="#" style="font-size: 14px; font-weight: 600; color: {{accent}};">Work</a>
      <a href="#" style="font-size: 14px; font-weight: 500; color: oklch(0.97 0.003 80 / 0.55);">About</a>
      <a href="#" style="font-size: 14px; font-weight: 500; color: oklch(0.97 0.003 80 / 0.55);">Contact</a>
    </div>
  </div>

  <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: oklch(0.18 0.01 80 / 0.45); margin-bottom: 16px;">03 — Minimal underline, no container</div>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px;">
    <div style="font-weight: 700; font-size: 16px;">Hum Rashid</div>
    <div style="display: flex; gap: 40px;">
      <div style="font-size: 14px; font-weight: 600; position: relative; padding-bottom: 6px;">
        Work
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 2px; border-radius: 2px; background: {{accent}};"></div>
      </div>
      <div style="font-size: 14px; font-weight: 500; color: oklch(0.18 0.01 80 / 0.45);">About</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#b3552c","options":["#b3552c","#8a6d3b","#5c6b73","#7a5c8c"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#b3552c' };
  }
}
</script>
</body>
</html>
