<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.75; }
  </style>
</helmet>

<div style="width: 1440px; min-height: 1560px; background: oklch(0.16 0.005 80); position: relative; color: oklch(0.96 0.003 80);">

  <!-- grid guides: real site spec, 12 cols / 24px gutter / 64px margin -->
  <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; padding: 0 64px; pointer-events: none; z-index: 0;">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="12">
      <div style="border-left: 1px dashed oklch(0.96 0.003 80 / 0.06); border-right: 1px dashed oklch(0.96 0.003 80 / 0.06); height: 100%;"></div>
    </sc-for>
  </div>

  <!-- hero -->
  <div style="position: relative; z-index: 1; padding: 120px 64px 100px; max-width: 920px;">
    <div style="font-size: 44px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; max-width: 14ch;">
      Positioning statement placeholder — locked during content phase.
    </div>
  </div>

  <!-- case study grid: 4 cards, 6 cols each (half width), 2x2 -->
  <div style="position: relative; z-index: 1; display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; padding: 0 64px 160px;">
    <sc-for list="{{cases}}" as="cs" hint-placeholder-count="4">
      <div style="grid-column: span 6; background: oklch(0.2 0.006 80); border-radius: 24px; padding: 20px; box-shadow: 0 1px 2px oklch(0 0 0 / 0.2), 0 20px 40px oklch(0 0 0 / 0.3);">
        <div style="height: 280px; border-radius: 16px; background: oklch(0.26 0.008 80); margin-bottom: 20px;"></div>
        <div style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">{{cs.title}}</div>
        <div style="font-size: 15px; color: oklch(0.96 0.003 80 / 0.55); line-height: 1.5; margin-bottom: 16px; max-width: 42ch;">{{cs.summary}}</div>
        <a href="#" style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: {{accent}};">
          Read Case Study
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </sc-for>
  </div>

  <!-- floating pill nav -->
  <div style="position: sticky; bottom: 32px; z-index: 10; display: flex; justify-content: center;">
    <div style="display: flex; align-items: center; gap: 28px; padding: 14px 24px; border-radius: 999px; background: oklch(0.24 0.006 80 / 0.7); backdrop-filter: blur(20px) saturate(160%); border: 1px solid oklch(0.96 0.003 80 / 0.1); box-shadow: 0 12px 32px oklch(0 0 0 / 0.35);">
      <div style="font-weight: 700; font-size: 15px;">Hum Rashid</div>
      <div style="width: 1px; height: 16px; background: oklch(0.96 0.003 80 / 0.15);"></div>
      <a href="#" style="font-size: 14px; font-weight: 600; color: {{accent}};">Work</a>
      <a href="#" style="font-size: 14px; font-weight: 500; color: oklch(0.96 0.003 80 / 0.55);">About</a>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#e0864f","options":["#e0864f","#c9a35c","#8fa3ab","#a98cc2"]}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#e0864f',
      cols: Array.from({length: 12}),
      cases: [
        { title: 'Pack Digital', summary: 'Product strategy and UI design for headless infrastructure startup.' },
        { title: 'Inveterate', summary: 'Product strategy and UI design for membership & loyalty startup.' },
        { title: 'PPVP', summary: 'Product strategy and mobile app design for SaaS investment fund.' },
        { title: 'Sublime Security', summary: 'Quarantine digests and dynamic phishing simulation campaigns for security teams.' },
      ],
    };
  }
}
</script>
</body>
</html>
