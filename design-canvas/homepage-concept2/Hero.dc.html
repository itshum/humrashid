<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }
  </style>
</helmet>

<div style="width: 1440px; height: 960px; background: #ffffff; color: #111111; position: relative; overflow: hidden;">

  <!-- nav -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 32px 64px; border-bottom: 1px solid #111111;">
    <div style="font-weight: 800; font-size: 15px; text-transform: uppercase;">Hum Rashid</div>
    <div style="display: flex; gap: 36px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;">
      <div>Work</div>
      <div style="color: #11111180;">About</div>
    </div>
  </div>

  <!-- massive bleeding type, image block breaking the grid -->
  <div style="position: relative; padding: 0 64px;">
    <div style="font-size: 260px; font-weight: 900; line-height: 0.82; letter-spacing: -0.04em; text-transform: uppercase; padding-top: 60px; color: #111111;">
      HUM
    </div>
    <div style="position: absolute; top: 210px; right: 64px; width: 380px; height: 460px; background: #111111;"></div>
    <div style="position: absolute; top: 210px; right: 64px; width: 380px; height: 460px; border: 1px solid #111111; transform: translate(16px, 16px);"></div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 40px 64px 0; border-top: 1px solid #111111; margin-top: 40px;">
    <div style="font-size: 15px; max-width: 42ch; color: #11111199; line-height: 1.6;">
      Placeholder supporting line — the real positioning copy locks during the content pass.
    </div>
    <div style="display: flex; align-items: center; height: 40px;">
      <div style="display: flex; align-items: center; padding: 0 22px; height: 100%; background: #111111; color: #ffffff; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;">
        View Work
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
