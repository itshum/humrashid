<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }
  </style>
</helmet>

<div style="width: 1440px; min-height: 1440px; background: #ffffff; color: #111111;">

  <!-- nav -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 64px; border-bottom: 1px solid #111111;">
    <div style="font-weight: 800; font-size: 15px; text-transform: uppercase;">Hum Rashid</div>
    <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #11111180;">← Back to work</div>
  </div>

  <!-- case study title block -->
  <div style="padding: 72px 64px 56px; border-bottom: 1px solid #111111;">
    <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #11111180; margin-bottom: 20px;">Case Study / 04</div>
    <div style="font-size: 72px; font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase;">Sublime Security</div>
  </div>

  <!-- boxy meta row: Company / Role / Timeframe / Team -->
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid #111111;">
    <div style="padding: 28px 32px; border-right: 1px solid #111111;">
      <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #11111180; margin-bottom: 8px;">Company</div>
      <div style="font-size: 16px; font-weight: 600;">Sublime Security</div>
    </div>
    <div style="padding: 28px 32px; border-right: 1px solid #111111;">
      <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #11111180; margin-bottom: 8px;">Role</div>
      <div style="font-size: 16px; font-weight: 600;">Lead Product Designer</div>
    </div>
    <div style="padding: 28px 32px; border-right: 1px solid #111111;">
      <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #11111180; margin-bottom: 8px;">Timeframe</div>
      <div style="font-size: 16px; font-weight: 600;">TBD</div>
    </div>
    <div style="padding: 28px 32px;">
      <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #11111180; margin-bottom: 8px;">Team</div>
      <div style="font-size: 16px; font-weight: 600;">TBD</div>
    </div>
  </div>

  <!-- asymmetric image block + description -->
  <div style="display: grid; grid-template-columns: repeat(12, 1fr); border-bottom: 1px solid #111111;">
    <div style="grid-column: span 7; border-right: 1px solid #111111; padding: 56px; display: flex; flex-direction: column; justify-content: center; gap: 20px;">
      <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #11111180;">Challenge</div>
      <div style="font-size: 15px; line-height: 1.7; max-width: 60ch; color: #111111cc;">
        Quarantine digests and dynamic phishing simulation campaigns for security teams — real case study copy locks during the content pass.
      </div>
    </div>
    <div style="grid-column: span 5; height: 460px; background: #111111;"></div>
  </div>

  <!-- next case study strip -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 32px 64px;">
    <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #11111180;">Next</div>
    <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase;">Pack Digital →</div>
  </div>

</div>
</x-dc>
</body>
</html>
